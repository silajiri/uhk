<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Únik z Mlžného lesa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-label="Přihlašovací obrazovka">
      <div class="hero-icon" aria-hidden="true">🌟</div>
      <h1>Únik z Mlžného lesa</h1>
      <p class="description">Přihlas se svým školním Google účtem a objev svoji roli v dobrodružství.</p>

      <button id="loginButton" class="login-button" type="button">
        <span class="button-icon">🟢</span>
        Přihlásit se přes Google
      </button>

      <div id="statusMessage" class="status-message" aria-live="polite"></div>
      <div id="spinner" class="spinner-row hidden" aria-hidden="true">
        <div class="spinner"></div>
        <span>Probíhá přihlášení…</span>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeLogin } from './src/auth.js';
    initializeLogin();
  </script>
</body>
</html>
