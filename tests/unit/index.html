<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jednotkové testy – Analýza chování</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f1ff;
      --card: #ffffff;
      --primary: #6752ff;
      --text: #2b2140;
      --muted: #6c5f7d;
      --border: rgba(103, 82, 255, 0.12);
      --shadow: 0 20px 50px rgba(103, 82, 255, 0.08);
      --success: #2ecc71;
      --error: #e74c3c;
      --warning: #f39c12;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 2rem 1.5rem;
      font-family: 'Fredoka', 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, #f7f1ff 0%, #fffafa 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 0.5rem 0;
      color: var(--primary);
      font-size: 2.2rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.1rem;
      margin: 0;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }

    .summary-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--border);
      font-weight: 600;
      font-size: 1.1rem;
    }

    .summary-badge {
      padding: 0.5rem 1rem;
      border-radius: 10px;
      color: #fff;
    }

    .summary-badge.pass {
      background-color: var(--success);
    }

    .summary-badge.fail {
      background-color: var(--error);
    }

    .test-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .test-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      transition: transform 150ms ease;
    }

    .test-item:hover {
      transform: translateY(-2px);
    }

    .test-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .test-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text);
    }

    .test-status {
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
    }

    .test-item.pass {
      border-left: 5px solid var(--success);
      background-color: rgba(46, 204, 113, 0.03);
    }

    .test-item.pass .test-status {
      background-color: rgba(46, 204, 113, 0.12);
      color: var(--success);
    }

    .test-item.fail {
      border-left: 5px solid var(--error);
      background-color: rgba(231, 76, 60, 0.03);
    }

    .test-item.fail .test-status {
      background-color: rgba(231, 76, 60, 0.12);
      color: var(--error);
    }

    .test-details {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .test-comparison {
      margin-top: 0.5rem;
      font-family: monospace;
      background: rgba(0, 0, 0, 0.03);
      padding: 0.5rem;
      border-radius: 6px;
      font-size: 0.8rem;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .links {
      text-align: center;
      margin-top: 2rem;
    }

    .links a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      margin: 0 1rem;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🧪 Jednotkové testy</h1>
      <p class="subtitle">Ověření správnosti behaviorální analýzy (Level 3)</p>
    </header>

    <div class="card">
      <div class="summary-bar">
        <div>Výsledky testů: <span id="passed-count">0</span> / <span id="total-count">0</span> úspěšných</div>
        <div id="overall-status" class="summary-badge fail">Spouštím...</div>
      </div>

      <div class="test-list" id="test-list">
        <!-- Testy budou vypsány skriptem -->
      </div>
    </div>

    <div class="links">
      <a href="../../admin.html">⚙️ Administrace</a>
      <a href="../../report.html">📊 Výsledky</a>
    </div>
  </div>

  <script type="module">
    import { analyzeRoomBehavior } from '../../src/report.js';

    // Definice testovacích případů
    const testCases = [
      {
        name: "Test 1: Úplný začátek (neaktivní L3)",
        room: {
          actions: {
            level3_truth: {
              sovaShared: false,
              rysShared: false
            }
          }
        },
        expected: {
          type: "inprogress",
          desc: "Čeká se na rozhodnutí",
          details: "Dosud nebyly sdíleny všechny úlomky.",
          sChoice: "none",
          rChoice: "none",
          sOutcome: "waiting",
          rOutcome: "waiting",
          sDecrypted: false,
          rDecrypted: false
        }
      },
      {
        name: "Test 2: Částečné sdílení (pouze Sova)",
        room: {
          actions: {
            level3_truth: {
              sovaShared: true,
              sovaShardStatus: "true",
              rysShared: false
            }
          }
        },
        expected: {
          type: "inprogress",
          desc: "⏳ Částečné sdílení",
          details: "Sova již sdílela, Rys vyčkává.",
          sChoice: "truth",
          rChoice: "none",
          sOutcome: "waiting",
          rOutcome: "waiting",
          sDecrypted: false,
          rDecrypted: false
        }
      },
      {
        name: "Test 3: Úspěšná spolupráce (oba pravda)",
        room: {
          actions: {
            level3_truth: {
              sovaShared: true,
              sovaShardStatus: "true",
              rysShared: true,
              rysShardStatus: "true",
              escapedPlayers: { player1: "escaped", player2: "escaped" }
            }
          }
        },
        expected: {
          type: "cooperate",
          desc: "🤝 Spolupráce",
          details: "Oba partneři sdíleli pravdivý úlomek.",
          sChoice: "truth",
          rChoice: "truth",
          sOutcome: "escaped",
          rOutcome: "escaped",
          sDecrypted: false,
          rDecrypted: false
        }
      },
      {
        name: "Test 4: Jednostranná zrada - Sova podvedla Rysa, Rys dešifroval a utekl",
        room: {
          actions: {
            level3_truth: {
              sovaShared: true,
              sovaShardStatus: "fake",
              rysShared: true,
              rysShardStatus: "true",
              escapedPlayers: { player1: "escaped", player2: "escaped" }
            }
          }
        },
        expected: {
          type: "betrayal-one",
          desc: "⚠️ Sova oklamala Rysa",
          details: "Sova odeslala lež, Rys pravdu. Reakce: 🔓 Rys odhalil lež a získal správný kód.",
          sChoice: "lie",
          rChoice: "truth",
          sOutcome: "escaped",
          rOutcome: "escaped",
          sDecrypted: false,
          rDecrypted: true
        }
      },
      {
        name: "Test 5: Jednostranná zrada - Rys podvedl Sovu, Sova zůstala čekat/nedešifrovala",
        room: {
          actions: {
            level3_truth: {
              sovaShared: true,
              sovaShardStatus: "true",
              rysShared: true,
              rysShardStatus: "fake",
              escapedPlayers: { player1: "waiting", player2: "escaped" }
            }
          }
        },
        expected: {
          type: "betrayal-one",
          desc: "⚠️ Rys oklamala Sovu",
          details: "Rys odeslal lež, Sova pravdu. Reakce: ⏳ Sova dosud nezískala správný kód.",
          sChoice: "truth",
          rChoice: "lie",
          sOutcome: "waiting",
          rOutcome: "escaped",
          sDecrypted: false,
          rDecrypted: false
        }
      },
      {
        name: "Test 6: Vzájemná zrada - oba fake, oba uvězněni po dešifrování",
        room: {
          actions: {
            level3_truth: {
              sovaShared: true,
              sovaShardStatus: "fake",
              rysShared: true,
              rysShardStatus: "fake",
              escapedPlayers: { player1: "trapped", player2: "trapped" }
            }
          }
        },
        expected: {
          type: "betrayal-mutual",
          desc: "🚨 Vzájemná zrada",
          details: "Oba se oklamali. Reakce: Sova získala správný kód, Rys získal správný kód.",
          sChoice: "lie",
          rChoice: "lie",
          sOutcome: "trapped",
          rOutcome: "trapped",
          sDecrypted: false,
          rDecrypted: false
        }
      }
    ];

    function runTests() {
      const container = document.getElementById('test-list');
      container.innerHTML = '';

      let passedCount = 0;
      
      testCases.forEach((tc, idx) => {
        const actual = analyzeRoomBehavior(tc.room);
        
        // Hluboké srovnání
        const diffs = [];
        for (const key in tc.expected) {
          if (actual[key] !== tc.expected[key]) {
            diffs.push(`${key}: očekáváno "${tc.expected[key]}", získáno "${actual[key]}"`);
          }
        }

        const isPassed = diffs.length === 0;
        if (isPassed) passedCount++;

        const item = document.createElement('div');
        item.className = `test-item ${isPassed ? 'pass' : 'fail'}`;

        let detailsHtml = `<div class="test-details"><strong>Vstup:</strong> ${JSON.stringify(tc.room.actions.level3_truth)}</div>`;
        if (!isPassed) {
          detailsHtml += `
            <div class="test-comparison">
              <strong>Chyby v porovnání:</strong>\n${diffs.join('\n')}
            </div>
          `;
        }

        item.innerHTML = `
          <div class="test-header">
            <span class="test-title">${tc.name}</span>
            <span class="test-status">${isPassed ? 'Úspěch' : 'Chyba'}</span>
          </div>
          ${detailsHtml}
        `;

        container.appendChild(item);
      });

      document.getElementById('passed-count').textContent = passedCount;
      document.getElementById('total-count').textContent = testCases.length;

      const overall = document.getElementById('overall-status');
      if (passedCount === testCases.length) {
        overall.textContent = "VŠE OK";
        overall.className = "summary-badge pass";
      } else {
        overall.textContent = "CHYBA";
        overall.className = "summary-badge fail";
      }
    }

    runTests();
  </script>
</body>
</html>
